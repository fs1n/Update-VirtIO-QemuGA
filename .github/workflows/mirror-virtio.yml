name: Mirror VirtIO & QEMU-GA from Fedora Archive

on:
  schedule:
    - cron: '0 3 * * *'   # täglich 03:00 UTC
  workflow_dispatch:        # manuell auslösbar

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      S3_BUCKET:   ${{ secrets.SYNOLOGY_S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.SYNOLOGY_S3_ENDPOINT }}  # https://eu-central-1.s3.synologyc2.net
      S3_REGION:   ${{ secrets.SYNOLOGY_S3_REGION }}    # eu-central-1
      S3_KEY:      ${{ secrets.SYNOLOGY_S3_KEY }}
      S3_SECRET:   ${{ secrets.SYNOLOGY_S3_SECRET }}
      KEEP_VERSIONS: "3"

    steps:

      # ── 1. Repo auschecken ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node + Playwright ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      # ── 3. rclone ─────────────────────────────────────────────────────────
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for Synology C2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [c2]
          type = s3
          provider = Synology
          access_key_id = $S3_KEY
          secret_access_key = $S3_SECRET
          region = $S3_REGION
          endpoint = $S3_ENDPOINT
          force_path_style = true
          no_check_bucket = true
          disable_checksum = true
          EOF

      # ── 4. S3-Zugang prüfen (schlägt früh fehl wenn Credentials falsch) ──
      - name: Validate S3 access
        run: rclone lsd c2:$S3_BUCKET --log-level INFO

      # ── 5. Scrape + Download via Playwright ───────────────────────────────
      - name: Scrape Fedora Archive and download MSIs
        run: node .github/scripts/mirror-scrape.js
        env:
          KEEP_VERSIONS: ${{ env.KEEP_VERSIONS }}

      # ── 6. Upload zu Synology C2 via rclone ──────────────────────────────
      - name: Upload to Synology C2
        run: |
          rclone sync ./mirror-out/ c2:$S3_BUCKET/virtio-mirror/ \
            --progress \
            --transfers 2 \
            --retries 3 \
            --log-level INFO

      # ── 7. Zusammenfassung in Job Summary ─────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## Mirror Run $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f mirror-out/manifest.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat mirror-out/manifest.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ manifest.json nicht gefunden – Scraping fehlgeschlagen?" >> $GITHUB_STEP_SUMMARY
          fi
