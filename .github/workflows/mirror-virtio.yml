name: Mirror VirtIO & QEMU-GA from Fedora Archive

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      KEEP_VERSIONS: "3"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Playwright + Chromium solves the Anubis PoW challenge on fedorapeople.org
      - name: Install Playwright and Chromium
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      # Scrape fedorapeople.org and write manifest.json with direct Fedora download URLs
      - name: Generate manifest
        run: node .github/scripts/mirror-scrape.js

      # Commit manifest.json to main so the PS1 script can fetch it directly
      - name: Commit manifest to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "chore: update manifest.json [skip ci]"
          git push

      - name: Write job summary
        if: always()
        run: |
          echo "## Mirror Run $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -f manifest.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat manifest.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "manifest.json not found — scraping may have failed" >> $GITHUB_STEP_SUMMARY
          fi
